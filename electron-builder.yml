appId: com.archflow.app
productName: ArchFlow
directories:
  output: dist
  buildResources: resources
files:
  - dist-electron/**/*
  - .next/**/*
  - node_modules/**/*
  - package.json
  - prisma/schema.prisma
  - next.config.mjs
asar: false
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
